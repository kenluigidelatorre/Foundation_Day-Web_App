openapi: 3.0.0

info:
  title: Foundation Day Booth Log Book API
  description: API for managing Foundation Day students, booths, and booth visit registrations.
  version: 1.0.0

servers:
  - url: http://localhost:5000

tags:
  - name: Dashboard
    description: Dashboard statistics

  - name: Booths
    description: Booth management

  - name: Registration Logs
    description: Student booth registration and visit logs


paths:

  # ==========================================
  # DASHBOARD
  # ==========================================

  /api/dashboard/stats:

    get:
      tags:
        - Dashboard

      summary: Get dashboard statistics

      description: >
        Returns total students, total booths, total booth visits,
        most visited booth, booth activity, and recent registrations.

      responses:

        "200":
          description: Dashboard statistics retrieved successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  totalStudents:
                    type: integer
                    example: 50

                  totalBooths:
                    type: integer
                    example: 5

                  totalVisits:
                    type: integer
                    example: 120

                  mostVisitedBooth:
                    type: object
                    nullable: true

                    properties:

                      booth_name:
                        type: string
                        example: Perya Booth

                      visitor_count:
                        type: integer
                        example: 35

                  boothActivity:
                    type: array

                    items:
                      type: object

                      properties:

                        id:
                          type: integer
                          example: 1

                        booth_name:
                          type: string
                          example: Perya Booth

                        visitor_count:
                          type: integer
                          example: 35

                        percentage:
                          type: number
                          format: float
                          example: 29.17

                  recentRegistrations:
                    type: array

                    items:
                      type: object

                      properties:

                        id:
                          type: integer
                          example: 10

                        student_id:
                          type: string
                          example: 2026-001

                        full_name:
                          type: string
                          example: Juan Dela Cruz

                        program:
                          type: string
                          example: BSIT

                        block_year:
                          type: string
                          example: 3-Python

                        booth_name:
                          type: string
                          example: Perya Booth

                        visit_date:
                          type: string
                          format: date
                          example: 2026-09-16

                        visit_time:
                          type: string
                          example: "10:30:00"


        "500":
          description: Failed to load dashboard statistics


  # ==========================================
  # BOOTHS
  # ==========================================

  /api/booths:

    get:
      tags:
        - Booths

      summary: Get all booths

      description: Returns all Foundation Day booths.

      responses:

        "200":
          description: List of booths retrieved successfully

          content:
            application/json:

              schema:
                type: array

                items:
                  $ref: "#/components/schemas/Booth"


        "500":
          description: Failed to load booths


    post:
      tags:
        - Booths

      summary: Add a new booth

      description: Creates a new Foundation Day booth.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/BoothRequest"

      responses:

        "201":
          description: Booth created successfully

          content:
            application/json:

              schema:
                $ref: "#/components/schemas/Booth"

        "400":
          description: Invalid booth information

        "500":
          description: Server error


  /api/booths/{id}:

    put:
      tags:
        - Booths

      summary: Update a booth

      description: Updates an existing Foundation Day booth.

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/BoothRequest"

      responses:

        "200":
          description: Booth updated successfully

        "404":
          description: Booth not found

        "500":
          description: Server error


    delete:
      tags:
        - Booths

      summary: Delete a booth

      description: Deletes an existing Foundation Day booth.

      parameters:

        - name: id
          in: path
          required: true

          schema:
            type: integer

          example: 1

      responses:

        "200":
          description: Booth deleted successfully

        "404":
          description: Booth not found

        "500":
          description: Server error


  # ==========================================
  # REGISTRATION LOGS
  # ==========================================

  /api/logs:

    get:
      tags:
        - Registration Logs

      summary: Get registration logs

      description: >
        Returns student booth visit records.
        Supports searching by student ID, full name,
        program, or booth name.

      parameters:

        - name: search
          in: query
          required: false

          description: >
            Search registration records by student ID,
            full name, program, or booth name.

          schema:
            type: string

          example: Juan

      responses:

        "200":
          description: Registration logs retrieved successfully

          content:
            application/json:

              schema:
                type: array

                items:
                  $ref: "#/components/schemas/RegistrationLog"


        "500":
          description: Failed to load registration logs


    post:
      tags:
        - Registration Logs

      summary: Register a student for a booth

      description: >
        Creates a student record if the student does not exist,
        then records the student's visit to the selected booth.
        A student cannot be registered twice for the same booth.

      requestBody:
        required: true

        content:
          application/json:

            schema:
              $ref: "#/components/schemas/RegistrationRequest"

      responses:

        "201":
          description: Student registered successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  message:
                    type: string
                    example: Student registered successfully.

                  registration:
                    type: object

                    properties:

                      id:
                        type: integer
                        example: 1

                      student_id:
                        type: integer
                        example: 1

                      booth_id:
                        type: integer
                        example: 1

                      visit_date:
                        type: string
                        format: date

                      visit_time:
                        type: string


        "400":
          description: Missing required information

        "409":
          description: Student is already registered for this booth

        "500":
          description: Registration failed


  /api/logs/{id}:

    delete:
      tags:
        - Registration Logs

      summary: Delete a registration

      description: Deletes a booth visit registration by ID.

      parameters:

        - name: id
          in: path
          required: true

          description: Registration log ID

          schema:
            type: integer

          example: 1

      responses:

        "200":
          description: Registration deleted successfully

          content:
            application/json:

              schema:
                type: object

                properties:

                  message:
                    type: string
                    example: Registration deleted successfully.

                  deleted:
                    $ref: "#/components/schemas/DeletedRegistration"


        "404":
          description: Registration not found

        "500":
          description: Failed to delete registration


# ==========================================
# COMPONENTS / SCHEMAS
# ==========================================

components:

  schemas:

    # ======================================
    # BOOTH
    # ======================================

    Booth:

      type: object

      properties:

        id:
          type: integer
          example: 1

        booth_name:
          type: string
          example: Perya Booth

        description:
          type: string
          example: Games and activities for Foundation Day.

        location:
          type: string
          example: Student Activity Area

        date_created:
          type: string
          format: date-time
          example: 2026-09-16T10:00:00.000Z


    # ======================================
    # BOOTH REQUEST
    # ======================================

    BoothRequest:

      type: object

      required:
        - booth_name

      properties:

        booth_name:
          type: string
          example: Perya Booth

        description:
          type: string
          example: Games and activities for Foundation Day.

        location:
          type: string
          example: Student Activity Area


    # ======================================
    # REGISTRATION REQUEST
    # ======================================

    RegistrationRequest:

      type: object

      required:
        - student_id
        - full_name
        - program
        - block_year
        - booth_id

      properties:

        student_id:
          type: string
          example: 2026-001

        full_name:
          type: string
          example: Juan Dela Cruz

        program:
          type: string
          example: BSIT

        block_year:
          type: string
          example: 3-Python

        booth_id:
          type: integer
          example: 1


    # ======================================
    # REGISTRATION LOG
    # ======================================

    RegistrationLog:

      type: object

      properties:

        id:
          type: integer
          example: 1

        student_id:
          type: string
          example: 2026-001

        full_name:
          type: string
          example: Juan Dela Cruz

        program:
          type: string
          example: BSIT

        block_year:
          type: string
          example: 3-Python

        booth_name:
          type: string
          example: Perya Booth

        location:
          type: string
          example: Student Activity Area

        visit_date:
          type: string
          format: date
          example: 2026-09-16

        visit_time:
          type: string
          example: "10:30:00"

        created_at:
          type: string
          format: date-time
          example: 2026-09-16T10:30:00.000Z


    # ======================================
    # DELETED REGISTRATION
    # ======================================

    DeletedRegistration:

      type: object

      properties:

        id:
          type: integer
          example: 1

        student_id:
          type: integer
          example: 1

        booth_id:
          type: integer
          example: 1

        visit_date:
          type: string
          format: date

        visit_time:
          type: string

        created_at:
          type: string
          format: date-time
